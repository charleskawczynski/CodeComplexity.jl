name: JuliaFormatter

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/julia-format@v4
        with:
          version: "1"
          # Leave unset or empty to show suggestions for all PRs; set to e.g. 'format-suggest' to require that label
          suggestion-label: ""
